# 定义默认的容器镜像，build 阶段没有指定镜像，所以会使用此镜像
image: hub.example.com/library/docker:24.0.5
services:
  # 在 docker 中启动 docker 用于编译镜像
  - name: hub.example.com/library/docker:24.0.5-dind
    alias: docker

# 定义变量，变量分为两种
# 一种是自定义变量，可以在.gitlab-ci.yml和项目的设置界面上进行配置
# 另一种是Gitlab内置变量，内置变量可参考：https://docs.gitlab.com/ee/ci/variables/
variables:
  IMAGE: $REPOSITORY/example/${CI_PROJECT_NAME}

  # When using dind service, you must instruct Docker to talk with
  # the daemon started inside of the service. The daemon is available
  # with a network connection instead of the default
  # /var/run/docker.sock socket.
  DOCKER_HOST: tcp://docker:2376
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/services/#accessing-the-services.
  # If you're using GitLab Runner 12.7 or earlier with the Kubernetes executor and Kubernetes 1.6 or earlier,
  # the variable must be set to tcp://localhost:2376 because of how the
  # Kubernetes executor connects services to the job container
  # DOCKER_HOST: tcp://localhost:2376
  #
  # Specify to Docker where to create the certificates. Docker
  # creates them automatically on boot, and creates
  # `/certs/client` to share between the service and job
  # container, thanks to volume mount from config.toml
  DOCKER_TLS_CERTDIR: "/certs"
  # These are usually specified by the entrypoint, however the
  # Kubernetes executor doesn't run entrypoints
  # https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4125
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

build:
  stage: build
  # 在script之前执行的命令
  before_script:
    - docker info
    # 组合项目分支名 CI_COMMIT_REF_SLUG 和项目提交短ID CI_COMMIT_SHORT_SHA 变量
    # 并赋值给 IMAGE_TAG 变量作为容器的标签，比如：master_44042448
    - export IMAGE_TAG=${CI_COMMIT_REF_SLUG}_${CI_COMMIT_SHORT_SHA}
  script:
    - echo 'Building...'
    # 登录镜像仓库，REPOSITORY_USER 和 REPOSITORY_PASSWORD 变量会在后面 Gitlab WEB 界面中进行设置
    - docker login -u $REPOSITORY_USER -p $REPOSITORY_PASSWORD $REPOSITORY
    # 编译容器镜像，Gitlab CI 会自动下载代码并跳转到代码根目录，在这个目录下有 Dockerfile
    - docker build -t ${IMAGE}:${IMAGE_TAG} .
    # 给镜像打 latest 标签
    - docker tag ${IMAGE}:${IMAGE_TAG} ${IMAGE}:latest
    # 推送镜像到镜像仓库
    - docker push ${IMAGE}:${IMAGE_TAG}
    - docker push ${IMAGE}:latest
  timeout: 3h
  rules:
    - if: '$BUILD_DISABLED'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"'
  tags:
    - k8s

